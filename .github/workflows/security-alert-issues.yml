name: Security alert issues

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # Shared job, see https://github.com/christoph-sens/ci-workflows
  sync:
    uses: christoph-sens/ci-workflows/.github/workflows/security-alert-issues.yml@7a75d04b0c4cab6c0ab7e52960d3ed532df81535 # v1.5.2
    permissions:
      issues: write
    secrets:
      alerts-token: ${{ secrets.DEPENDABOT_ALERTS_TOKEN }}
