name: Security alert issues

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # Shared job, see https://github.com/christoph-sens/ci-workflows
  sync:
    uses: christoph-sens/ci-workflows/.github/workflows/security-alert-issues.yml@d5fd261715166b1b116e2530341dd8c70895e383 # v1.4.0
    permissions:
      issues: write
    secrets:
      alerts-token: ${{ secrets.DEPENDABOT_ALERTS_TOKEN }}
