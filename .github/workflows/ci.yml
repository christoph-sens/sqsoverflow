name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Shared CI, see https://github.com/christoph-sens/ci-workflows
  ci:
    uses: christoph-sens/ci-workflows/.github/workflows/gradle-ci.yml@e2ecefaca92d58944dfa4d4d2a8a08a19b668e2b # v1.0.0
    permissions:
      contents: write        # dependency submission on push to main
      security-events: write # CodeQL and Trivy results
    with:
      gradle-tasks: build publishToMavenLocal
      integration-tests: true
