name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * 1"
  # By hand, e.g. when main has no dependency graph snapshot after a merge that started no CI run.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Shared CI, see https://github.com/christoph-sens/ci-workflows
  ci:
    uses: christoph-sens/ci-workflows/.github/workflows/gradle-ci.yml@d5fd261715166b1b116e2530341dd8c70895e383 # v1.4.0
    permissions:
      contents: write        # dependency submission on push to main
      security-events: write # CodeQL and Trivy results
    with:
      gradle-tasks: build publishToMavenLocal
      integration-tests: true
