name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  # Shared job, see https://github.com/christoph-sens/ci-workflows
  auto-merge:
    uses: christoph-sens/ci-workflows/.github/workflows/dependabot-auto-merge.yml@74ae2a5c395bb847aef5c859c1e8307cde132293 # v1.5.5
    secrets:
      # Dependabot secret: a merge with GITHUB_TOKEN would start no CI run on main.
      merge-token: ${{ secrets.AUTO_MERGE_TOKEN }}
