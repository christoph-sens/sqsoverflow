name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  # Shared job, see https://github.com/christoph-sens/ci-workflows
  auto-merge:
    uses: christoph-sens/ci-workflows/.github/workflows/dependabot-auto-merge.yml@d5fd261715166b1b116e2530341dd8c70895e383 # v1.4.0
    secrets:
      # Dependabot secret: a merge with GITHUB_TOKEN would start no CI run on main.
      merge-token: ${{ secrets.AUTO_MERGE_TOKEN }}
