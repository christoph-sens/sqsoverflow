name: Release

on:
  push:
    tags: ["v*"]
  # Manual run = dry run: verifies and builds the artifacts, never publishes.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        name: Determine version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Tag $GITHUB_REF_NAME is not a SemVer tag (expected vX.Y.Z)"
              exit 1
            fi
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            # Dry run: use a release-style (non-SNAPSHOT) version so the release code path is exercised.
            echo "version=0.0.0-dryrun" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: Build, test and assemble publication
        # Builds everything that gets published (jar, sources, javadoc, POM) without signing: the
        # signing keys only exist in the publish job. CI checks the full publication on every PR.
        run: ./gradlew build integrationTest sourcesJar plainJavadocJar generatePomFileForMavenPublication -PreleaseVersion=${{ steps.version.outputs.version }}
      - uses: actions/upload-artifact@v7
        with:
          name: jars
          path: build/libs/*.jar
          retention-days: 7

  publish:
    needs: verify
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Requires manual approval; the Maven Central and signing secrets live only in this environment.
    environment: maven-central
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Publish to Maven Central
        run: ./gradlew publishAndReleaseToMavenCentral -PreleaseVersion=${{ needs.verify.outputs.version }} --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: jars
          path: jars
      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" jars/*.jar --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
